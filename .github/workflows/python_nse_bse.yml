name: NSE_BSE_Daily_Trade_Summary

on:
  schedule:
    # Script only includes the current day after 19:30 IST
    - cron: '30 14 * * *'  # 14:30 UTC = 20:00 IST
  workflow_dispatch:  # allows manual trigger from GitHub UI

permissions:
  contents: write

concurrency:
  group: nse-bse-daily
  cancel-in-progress: false

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas pytz

      - name: Run the NSE BSE script
        run: python "NSE BSE Combined.py"

      - name: Commit updated summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Combined/combined_nse_bse_trade_summary.csv
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Auto: Update NSE/BSE trade summary - $(date -u +'%Y-%m-%d')"
          git pull --rebase origin main
          git push origin HEAD:main
